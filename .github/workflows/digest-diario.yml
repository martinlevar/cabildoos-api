name: Digest Diario

on:
  schedule:
    # 12:00 UTC = 8:00 AM Venezuela (UTC-4)
    - cron: "0 12 * * *"
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Enviar digest diario
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.API_URL }}/api/digest/send" \
            -H "X-Digest-Secret: ${{ secrets.DIGEST_SECRET }}" \
            -H "Content-Type: application/json")

          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/response.json

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "ERROR: digest endpoint returned $HTTP_STATUS"
            exit 1
          fi
